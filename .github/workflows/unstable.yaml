name: unstable

on:
  push:
    branches-ignore:
      - main

permissions:
  contents: read
  id-token: write

env:
  REGISTRY_IMAGE: ${{ vars.ECR_TESTING_URL }}/${{ github.event.repository.name }}

jobs:

  bps:
    name: "Build platform-specific image"
    runs-on: ${{ matrix.platform == 'linux/amd64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm-large' }}
    strategy:
      matrix:
        os:
          - redhat
          - ubuntu
        platform:
          - linux/amd64
          - linux/arm64
    steps:

      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        if: ${{ github.event_name == 'push' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.ECR_TESTING_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        if: ${{ github.event_name == 'push' }}
        uses: aws-actions/amazon-ecr-login@v2

      - name: Get short hash
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      # TODO(mredolatti): remove once all repos are public
      - name: Setup .netrc with permissions for private repos (Go dependencies)
        uses: danielr1996/envsubst-action@1.1.0
        env:
          TOKEN: ${{ secrets.DEVOPS_READONLY_GITHUB_TOKEN }}
        with:
          input: .netrc.tpl
          output: .netrc

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.os }}/Dockerfile
          tags: ${{ env.REGISTRY_IMAGE }}-${{ matrix.os }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/${{ matrix.os }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/${{ matrix.os }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.os }}-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/${{ matrix.os }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os:
          - redhat
          - ubuntu
    needs:
      - bps
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/${{ matrix.os }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Configure AWS credentials
        if: ${{ github.event_name == 'push' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.ECR_TESTING_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        if: ${{ github.event_name == 'push' }}
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}-${{ matrix.os }}
          tags: |
            type=sha

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/${{ matrix.os }}/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY_IMAGE }}-${{ matrix.os }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE }}-${{ matrix.os }}:${{ steps.meta.outputs.version }}

