name: unstable

on:
  push:
    branches-ignore:
      - master

jobs:
  push-docker-image:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os:
          - ubuntu
          - redhat
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # temporarily disable multi-arch for faster build-deploy cycles
      #- name: Setup QEMU
      #  uses: docker/setup-qemu-action@v3
      #  with:
      #    platforms: amd64,arm64

      #- name: Set up Docker Buildx
      #  uses: docker/setup-buildx-action@v3

      - name: Login to Dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_RO_TOKEN }}



      - name: Login to Artifactory
        uses: docker/login-action@v3
        with:
          registry: splitio-docker-dev.jfrog.io
          username: ${{ vars.ARTIFACTORY_DOCKER_USER }}
          password: ${{ secrets.ARTIFACTORY_DOCKER_PASS }}

      - name: Get short hash
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Docker Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.os }}/Dockerfile
          push: ${{ github.event_name == 'push' }}
          platforms: linux/amd64 #,linux/arm64 -- temporarily disable multi-arcxh
          tags: splitio-docker-dev.jfrog.io/fme-proxy-${{ matrix.os }}:${{ env.SHORT_SHA }}
