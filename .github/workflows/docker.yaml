name: docker

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.run_number || github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os:
          - ubuntu
          - redhat
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: amd64,arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_RO_TOKEN }}

      - name: Configure AWS credentials
        if: ${{ github.event_name == 'push' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.ECR_TESTING_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        if: ${{ github.event_name == 'push' }}
        uses: aws-actions/amazon-ecr-login@v2

      - name: Get version
        run: echo "VERSION=$(cat VERSION)" >> $GITHUB_ENV

      - name: Prepare tags for docker image
        run: |
          echo 'TAGS_UBUNTU=splitsoftware/fme-proxy:latest,splitsoftware/fme-proxy:${{env.VERSION}},splitsoftware/fme-proxy:ubuntu-latest,splitsoftware/fme-proxy:ubuntu-${{ env.VERSION }}' >> $GITHUB_ENV
          echo 'TAGS_REDHAT=splitsoftware/fme-proxy:redhat-latest,splitsoftware/fme-proxy:redhat-${{ env.VERSION }}' >> $GITHUB_ENV

      - name: Setup .netrc with permissions for private repos (Go dependencies)
        uses: danielr1996/envsubst-action@1.1.0
        env:
          TOKEN: ${{ secrets.DEVOPS_READONLY_GITHUB_TOKEN }}
        with:
          input: .netrc.tpl
          output: .netrc


      # TODO(mredolatti):
      # add the following tags if we want tagged versions in stage
      #      ${{ vars.ECR_TESTING_URL }}/${{ github.event.repository.name }}-${{ matrix.os }}:${{ env.VERSION }}
      #      ${{ vars.ECR_TESTING_URL }}/${{ github.event.repository.name }}-${{ matrix.os }}:latest

