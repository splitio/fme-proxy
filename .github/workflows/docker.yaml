name: docker

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.run_number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os:
          - ubuntu
          - redhat
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: amd64,arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get version
        run: echo "VERSION=$(cat VERSION)" >> $GITHUB_ENV

      - name: Prepare tags for docker image
        run: |
          echo 'TAGS_UBUNTU=splitsoftware/fme-proxy:latest,splitsoftware/fme-proxy:${{env.VERSION}},splitsoftware/fme-proxy:ubuntu-latest,splitsoftware/fme-proxy:ubuntu-${{ env.VERSION }}' >> $GITHUB_ENV
          echo 'TAGS_REDHAT=splitsoftware/fme-proxy:redhat-latest,splitsoftware/fme-proxy:redhat-${{ env.VERSION }}' >> $GITHUB_ENV

      - name: Docker Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.os }}/Dockerfile
          push: ${{ github.event_name == 'push' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ matrix.os == "ubuntu" && env.TAGS_UBUNTU || env.TAGS_REDHAT }}
