name: docker

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.run_number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os:
          - ubuntu
          # temporarily disable red hat for faster build/deploy cycles
          #- redhat
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # temporarily disable multi-arch for faster build-deploy cycles
      #- name: Setup QEMU
      #  uses: docker/setup-qemu-action@v3
      #  with:
      #    platforms: amd64,arm64

      #- name: Set up Docker Buildx
      #  uses: docker/setup-buildx-action@v3

      - name: Login to Dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_RO_TOKEN }}

      - name: Login to Artifactory
        if: ${{ github.event_name == 'push' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.ARTIFACTORY_DOCKER_REGISTRY }}
          username: ${{ vars.ARTIFACTORY_DOCKER_USER }}
          password: ${{ secrets.ARTIFACTORY_DOCKER_PASS }}

      - name: Get version
        run: echo "VERSION=$(awk '/^const Version/{gsub(/"/, "", $4); print $4}' splitio/version.go)" >> $GITHUB_ENV

      - name: Docker Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.os }}/Dockerfile
          push: ${{ github.event_name == 'push' }}
          platforms: linux/amd64 # ,linux/arm64 -- temporaily disable multi-arch
          tags: ${{ vars.ARTIFACTORY_DOCKER_REGISTRY }}/fme-proxy-${{ matrix.os }}:${{ env.VERSION }},${{ vars.ARTIFACTORY_DOCKER_REGISTRY }}/fme-proxy-${{ matrix.os }}:latest
