
#user  nobody;
worker_processes  1;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       mime.types;
    default_type  application/octet-stream;

    #log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
    #                  '$status $body_bytes_sent "$http_referer" '
    #                  '"$http_user_agent" "$http_x_forwarded_for"';

    #access_log  logs/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;


    # server-side TLS (no auth)
    server {
        listen                          3128 ssl;

        ssl_certificate_key             /etc/ssl/proxy/server.key;
        ssl_certificate                 /etc/ssl/proxy/server.crt;
        ssl_session_cache               shared:SSL:1m;

        # dns resolver used by forward proxying
        resolver                       8.8.8.8 ipv6=off;

        # forward proxy for CONNECT requests
        proxy_connect;
        proxy_connect_allow            443 563;
        proxy_connect_connect_timeout  10s;
        proxy_connect_data_timeout     120s;
    }

    # mTLS
    server {
        listen                          3129 ssl;

        ssl_certificate_key             /etc/ssl/proxy/server.key;
        ssl_certificate                 /etc/ssl/proxy/server.crt;
        ssl_client_certificate          /etc/ssl/proxy/ca.crt; # for validating clients via mTLS
        ssl_verify_client               on;
        ssl_session_cache               shared:SSL:1m;

        # dns resolver used by forward proxying
        resolver                       8.8.8.8 ipv6=off;

        # forward proxy for CONNECT requests
        proxy_connect;
        proxy_connect_allow            443 563;
        proxy_connect_connect_timeout  10s;
        proxy_connect_data_timeout     120s;
    }

    # server-side TLS + basic auth
    server {
        listen                          3130 ssl;
    
        ssl_certificate_key             /etc/ssl/proxy/server.key;
        ssl_certificate                 /etc/ssl/proxy/server.crt;
        ssl_session_cache               shared:SSL:1m;
    
        auth_basic                      "server_auth";
        auth_basic_user_file            /etc/keys/proxy/basic.passwd;
    
        # dns resolver used by forward proxying
        resolver                       8.8.8.8 ipv6=off;
    
        # forward proxy for CONNECT requests
        proxy_connect;
        proxy_connect_allow            443 563;
        proxy_connect_connect_timeout  10s;
        proxy_connect_data_timeout     120s;
    
        # transfer Proxy-Authorization header to Authorization header
        rewrite_by_lua_file /usr/local/openresty/nginx/scripts/proxy_auth_basic.lua;
    }
    
    # server-side TLS + bearer auth
    server {
        listen                          3131 ssl;
    
        ssl_certificate_key             /etc/ssl/proxy/server.key;
        ssl_certificate                 /etc/ssl/proxy/server.crt;
        ssl_session_cache               shared:SSL:1m;
    
        auth_jwt "all";
        auth_jwt_key_file /etc/keys/proxy/keys.jwks;
    
        # dns resolver used by forward proxying
        resolver                       8.8.8.8 ipv6=off;
    
        # forward proxy for CONNECT requests
        proxy_connect;
        proxy_connect_allow            443 563;
        proxy_connect_connect_timeout  10s;
        proxy_connect_data_timeout     120s;
    
        # transfer Proxy-Authorization header to Authorization header
        rewrite_by_lua_file /usr/local/openresty/nginx/scripts/proxy_auth.lua;
    }

    # insecure connection + digest AUTH
    server {
        listen                          3132;

        auth_digest                     "harness";
        auth_digest_user_file           /etc/keys/proxy/digest.passwd;

        # dns resolver used by forward proxying
        resolver                       8.8.8.8 ipv6=off;

        # forward proxy for CONNECT requests
        proxy_connect;
        proxy_connect_allow            443 563;
        proxy_connect_connect_timeout  10s;
        proxy_connect_data_timeout     120s;

        # transfer Proxy-Authorization header to Authorization header
        rewrite_by_lua_file         /usr/local/openresty/nginx/scripts/proxy_auth_digest.lua;
        header_filter_by_lua_file   /usr/local/openresty/nginx/scripts/proxy_auth_digest_status.lua;
    }


}
