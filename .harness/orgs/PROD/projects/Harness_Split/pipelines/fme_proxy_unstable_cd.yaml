pipeline:
  name: fme_proxy_unstable_cd
  identifier: fme_proxy_unstable_cd
  orgIdentifier: PROD
  projectIdentifier: Harness_Split
  properties:
    ci:
      codebase:
        connectorRef: fmegithubrunnersci
        repoName: fme-proxy
        build: <+input>
        depth: 0
  stages:
    - stage:
        name: build_ubuntu_amd64
        identifier: build_ubuntu_amd64
        type: CI
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec:
              size: flex
          execution:
            steps:
              - step:
                  type: Run
                  name: setup_netrc
                  identifier: setup_netrc
                  spec:
                    shell: Bash
                    envVariables:
                      TOKEN: <+secrets.getValue("fme-github-netrc-token")>
                    command: printf 'machine github.com\n    login devops-split\n    password %s\n' "${TOKEN}" > .netrc
              - step:
                  type: BuildAndPushECR
                  name: build_and_push
                  identifier: build_and_push
                  spec:
                    connectorRef: ecrtesting
                    region: us-east-1
                    account: "420799445691"
                    imageName: fme-proxy-ubuntu
                    dockerfile: ubuntu/Dockerfile
                    context: .
                    tags:
                      - sha-<+codebase.shortCommitSha>-amd64
                    baseImageConnectorRefs:
                      - dockerhub
                    optimize: true

    - stage:
        name: build_ubuntu_arm64
        identifier: build_ubuntu_arm64
        type: CI
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Arm64
          runtime:
            type: Cloud
            spec:
              size: flex
          execution:
            steps:
              - step:
                  type: Run
                  name: setup_netrc
                  identifier: setup_netrc
                  spec:
                    shell: Bash
                    envVariables:
                      TOKEN: <+secrets.getValue("fme-github-netrc-token")>
                    command: printf 'machine github.com\n    login devops-split\n    password %s\n' "${TOKEN}" > .netrc
              - step:
                  type: BuildAndPushECR
                  name: build_and_push
                  identifier: build_and_push
                  spec:
                    connectorRef: ecrtesting
                    region: us-east-1
                    account: "420799445691"
                    imageName: fme-proxy-ubuntu
                    dockerfile: ubuntu/Dockerfile
                    context: .
                    tags:
                      - sha-<+codebase.shortCommitSha>-arm64
                    baseImageConnectorRefs:
                      - dockerhub
                    optimize: true

    - stage:
        name: build_redhat_amd64
        identifier: build_redhat_amd64
        type: CI
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec:
              size: flex
          execution:
            steps:
              - step:
                  type: Run
                  name: setup_netrc
                  identifier: setup_netrc
                  spec:
                    shell: Bash
                    envVariables:
                      TOKEN: <+secrets.getValue("fme-github-netrc-token")>
                    command: printf 'machine github.com\n    login devops-split\n    password %s\n' "${TOKEN}" > .netrc
              - step:
                  type: BuildAndPushECR
                  name: build_and_push
                  identifier: build_and_push
                  spec:
                    connectorRef: ecrtesting
                    region: us-east-1
                    account: "420799445691"
                    imageName: fme-proxy-redhat
                    dockerfile: redhat/Dockerfile
                    context: .
                    tags:
                      - sha-<+codebase.shortCommitSha>-amd64
                    baseImageConnectorRefs:
                      - dockerhub
                    optimize: true

    - stage:
        name: build_redhat_arm64
        identifier: build_redhat_arm64
        type: CI
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Arm64
          runtime:
            type: Cloud
            spec:
              size: flex
          execution:
            steps:
              - step:
                  type: Run
                  name: setup_netrc
                  identifier: setup_netrc
                  spec:
                    shell: Bash
                    envVariables:
                      TOKEN: <+secrets.getValue("fme-github-netrc-token")>
                    command: printf 'machine github.com\n    login devops-split\n    password %s\n' "${TOKEN}" > .netrc
              - step:
                  type: BuildAndPushECR
                  name: build_and_push
                  identifier: build_and_push
                  spec:
                    connectorRef: ecrtesting
                    region: us-east-1
                    account: "420799445691"
                    imageName: fme-proxy-redhat
                    dockerfile: redhat/Dockerfile
                    context: .
                    tags:
                      - sha-<+codebase.shortCommitSha>-arm64
                    baseImageConnectorRefs:
                      - dockerhub
                    optimize: true

    - stage:
        name: merge_manifests
        identifier: merge_manifests
        type: CI
        spec:
          cloneCodebase: false
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec:
              size: flex
          execution:
            steps:
              - step:
                  type: Run
                  name: ecr_login
                  identifier: ecr_login
                  spec:
                    connectorRef: dockerhub
                    image: amazon/aws-cli:latest
                    shell: Bash
                    envVariables:
                      ECR_TESTING_URL: <+secrets.getValue("ECR_TESTING_URL")>
                      AWS_REGION: us-east-1
                    command: |
                      aws ecr get-login-password --region ${AWS_REGION} | \
                        docker login --username AWS --password-stdin ${ECR_TESTING_URL}
              - step:
                  type: Run
                  name: create_ubuntu_manifest
                  identifier: create_ubuntu_manifest
                  spec:
                    connectorRef: dockerhub
                    image: docker:dind
                    shell: Bash
                    envVariables:
                      ECR_TESTING_URL: <+secrets.getValue("ECR_TESTING_URL")>
                    command: |
                      SHA=<+codebase.shortCommitSha>
                      REGISTRY_IMAGE="${ECR_TESTING_URL}/fme-proxy-ubuntu"
                      docker buildx imagetools create \
                        -t "${REGISTRY_IMAGE}:sha-${SHA}" \
                        "${REGISTRY_IMAGE}:sha-${SHA}-amd64" \
                        "${REGISTRY_IMAGE}:sha-${SHA}-arm64"
                      docker buildx imagetools inspect "${REGISTRY_IMAGE}:sha-${SHA}"
              - step:
                  type: Run
                  name: create_redhat_manifest
                  identifier: create_redhat_manifest
                  spec:
                    connectorRef: dockerhub
                    image: docker:dind
                    shell: Bash
                    envVariables:
                      ECR_TESTING_URL: <+secrets.getValue("ECR_TESTING_URL")>
                    command: |
                      SHA=<+codebase.shortCommitSha>
                      REGISTRY_IMAGE="${ECR_TESTING_URL}/fme-proxy-redhat"
                      docker buildx imagetools create \
                        -t "${REGISTRY_IMAGE}:sha-${SHA}" \
                        "${REGISTRY_IMAGE}:sha-${SHA}-amd64" \
                        "${REGISTRY_IMAGE}:sha-${SHA}-arm64"
                      docker buildx imagetools inspect "${REGISTRY_IMAGE}:sha-${SHA}"
        when:
          pipelineStatus: Success
